# Dataset v1 (ISBI 2027). Paths are relative to the repo root.
# Every value here is explained in ../visual-guide/DECISIONS.md (D-numbers in comments).
paths:
  raw: ../dataset/IXI-T1          # read-only
  prep: ../dataset/IXI-T1-prep    # Stage 1 output
  calib: ../dataset/stage2-calibration   # Stage 2 calibration output
  out: ../dataset/blind-mri-v1     # Stage 3 output (D11, D56)
seed: 20261026

stage1:
  # 47 split subjects + 13 reserves, proportional to IXI's 322 / 185 / 74 per site (D04)
  priority_quota: {Guys: 33, HH: 19, IOP: 8}
  hdbet: {device: mps, tta: false}                       # D03
  n4: {shrink: 4, levels: 4, iterations: 50, convergence: 0.001}   # D14
  resample: {spacing_mm: 1.0, image_interp: bspline, mask_interp: nearest}   # D14
  wm: {sigma_smooth_vox: 1.0, erode_iter: 2}             # region for σ, CoV and contrast (D12)
  qc:                                                    # D17, D20
    brain_l: [0.9, 2.0]
    main_cc_min: 0.95      # largest HD-BET piece / all pieces (D37)
    contrast_ratio_min: 0.95
    sigma: [0.005, 0.10]
  pool_max_workers: 4                                    # D18

# Stage 2: artifact simulation (approved 17 Oct). Levels revised and signed 19 Oct (D59–D64): every level of every
# artifact is a usable-but-degraded scan, below the clinical rescan line (median MR-ART "bad" scan, damage 0.061).
# Levels: mild / moderate / borderline ("borderline" was "severe", D64). All bands frozen. Two or more motion-like
# artifacts in one case share one damage budget (D65, 19 Oct).
stage2:
  canvas: [192, 240]          # (LR, AP) at 1 mm; PE = LR = last tensor axis (D05, D09, D30)
  pe_axis: LR
  # Shared damage scale (D59): brain RMS change the artifact alone does to the clean slice, WM = 1. Anchors = MR-ART
  # per-scan values: "medium" p25 → median / median → p75 / p75 → "bad" median (the medium/bad overlap).
  damage_band: &damage [[0.026, 0.038], [0.038, 0.048], [0.048, 0.061]]
  bias:                       # field max/min − 1 inside the slice's brain mask (D07); inside real IXI fields (D63)
    target_maxmin: [[0.15, 0.25], [0.35, 0.45], [0.55, 0.70]]
    order: 3
  motion:                     # in-plane only, centred affine, B-spline (D31); level by brain RMS error (D32, D41)
    moves: [[1, 2], [1, 2], [1, 2]]             # one gentle prior for every level (D62); was 1–2 / 2–3 / 3–4
    degrees: [[0, 2], [0, 2], [0, 2]]           # was 0–2 / 3–5 / 6–10
    translation_mm: [[0, 2], [0, 2], [0, 2]]    # was 0–2 / 3–5 / 6–10
    rms_band: *damage         # D59; was 0.026–0.049 / 0.049–0.081 / 0.081–0.140 (D44)
    max_tries: 200            # D62: acceptance ≈ 19–26 % per level
    image_interpolation: bspline
  ghosting:                   # n ghosts of ratio g, intensity = n·g (D33); g set by damage on the clean slice (D60)
    rms_band: *damage         # was ghost ratio g 0.05–0.09 / 0.10–0.16 / 0.18–0.25 (D48)
    num_ghosts: [2, 4]
    restore: null
  spike:                      # stripe amplitude a set by damage on the clean slice (D60), kept on the current input (D34)
    rms_band: *damage         # was stripe amplitude a 0.04–0.08 / 0.10–0.16 / 0.18–0.26 (D43)
    n_spikes: [1, 2]
    k_offset: [10, 60]
  budget:                     # D65 (option C, 19 Oct): motion-like artifacts in one case share one damage budget, as a rater
    pool: [motion, ghosting, spike]   # grades them as one "motion" characteristic (bottani2022 Table 1); noise and bias apart
    min_share: 0.020          # each share ≥ max(own σ, this): visible (D29) and reachable by motion's gentle prior (D62)
    motion_tol: 0.08          # motion hits its share by rejection within ±8 %
    motion_max_tries: 3000
  noise:                      # white Rician (D02, D27); level = total σ, native ⊕ added, in WM units (D45, D49)
    sigma_total: [[0.030, 0.038], [0.038, 0.048], [0.048, 0.061]]   # D61: clinical grade 1 → rescan line; was 3–4.5 / 5.5–7 / 8–10 %
  calibration:                # D28, D38, D40
    quota: {Guys: 5, HH: 3, IOP: 2}
    max_native_sigma: 0.04
    offsets_mm: [-12, -4, 4, 12]
    prior_draws: 10           # motion prior draws per slice and level (D32)
    stat_draws: 10            # draws per slice for the PSNR/SSIM statistics
    grid_draws: 3             # draws per cell on z* for the visual grids

# Stage 3: case assembly (before-doc approved 19 Oct, D51–D58).
stage3:
  max_native_sigma: 0.030     # D51: own σ must be below the mild noise band's lower end (D61)
  split:                      # D52: per site, filled in the fixed priority order (D04): test, then dev, then reserves
    test: {Guys: 20, HH: 12, IOP: 5}
    dev: {Guys: 6, HH: 3, IOP: 1}
    reserve: {Guys: 5, HH: 4, IOP: 2}
  offsets_mm:                 # D54: from z*, the largest brain-area slice (D13)
    test: [-12, -4, 4, 12]
    dev: [-15, -9, -3, 3, 9, 15]
    sweep: [0]
  copies:                     # cases per combination (D47, D55); regular = 0–3 artifacts, stress = 4 or 5
    test: {regular: 5, stress4: 3, stress5: 3}
    dev: {regular: 2, stress4: 1, stress5: 3}
  stress_levels: [mild, moderate]   # D47
  max_attempts: 5             # D58: a case whose sampling fails is redrawn with the next seed
  flagged: {}                 # D57: subject id → reason; replaced in place by the next reserve of its site
  # D66: frozen 19 Oct 2026. Built by commit a7be648 (git tag blind-mri-v1); 1,434 files listed with SHA-256 in
  # ../dataset/blind-mri-v1.sha256 (digest of that list 8b56d98d…015b5f). `build_cases.py build` refuses while frozen.
  frozen: true
